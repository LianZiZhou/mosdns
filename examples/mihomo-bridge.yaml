# 部署模板：替换两个文档示例上游地址和客户端网段。
log:
  level: info
api:
  http: 127.0.0.1:9091

plugins:
  - tag: domain_index
    type: domain_mapping
    args:
      size: 262144 # 观察记录数，包含客户端/IP/域名/来源；不是独立 IP 数。
      retention:
        mode: lru # DNS 到期后仍保留，直到容量 LRU 淘汰；省略配置则保持旧版 ttl 模式。
        ttl_multiplier: 10
        min_window: 300 # 路由有效期下限，秒，覆盖 lazy answer 的 5 秒 TTL。
        max_window: 86400 # 单次路由窗口上限，秒；不是 LRU 记录的硬截止。
      api:
        max_concurrent: 128 # lookup/stats 共用的活动请求上限，超额立即拒绝并尝试返回 503。
        timeout: 1000 # 毫秒；Mihomo 仍使用自己的 50 ms 查询预算。
      allocation:
        enable: false
        size: 65536

  - tag: cache_a
    type: cache
    args:
      size: 4096
      lazy_cache_ttl: 86400
      # 落盘时每个策略使用独立新文件，目录须可写。
      # dump_file: /var/lib/mosdns/policy-a-v1.dump
  - tag: cache_b
    type: cache
    args:
      size: 4096
      lazy_cache_ttl: 86400
      # dump_file: /var/lib/mosdns/policy-b-v1.dump

  - tag: upstream_a
    type: forward
    args:
      upstreams:
        - addr: udp://192.0.2.53:53 # 必须替换：文档示例地址
  - tag: upstream_b
    type: forward
    args:
      upstreams:
        - addr: udp://198.51.100.53:53 # 必须替换：文档示例地址

  - tag: policy_a
    type: sequence
    args:
      - exec: $cache_a
      - matches: has_resp
        exec: accept
      - exec: $upstream_a
  - tag: policy_b
    type: sequence
    args:
      - exec: $cache_b
      - matches: has_resp
        exec: accept
      - exec: $upstream_b

  - tag: main
    type: sequence
    args:
      # 必须位于缓存、fallback、应答变换和策略分支外层。
      - exec: $domain_index
      - matches: client_ip 192.168.10.0/24 fd00:10::/64
        exec: goto policy_a
      - exec: goto policy_b

  - tag: udp
    type: udp_server
    args:
      entry: main
      listen: 127.0.0.1:5335
      trusted_ecs: [127.0.0.1/32]
  - tag: tcp
    type: tcp_server
    args:
      entry: main
      listen: 127.0.0.1:5335
      trusted_ecs: [127.0.0.1/32]
